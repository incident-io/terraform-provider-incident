# Terraform Provider testing workflow.
name: Tests

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'DEVELOPING.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'DEVELOPING.md'

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          skip-cache: true

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
      # Required to `terraform fmt` the generated files
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)
      - name: git status
        run: |
          test -z "$(git status --porcelain)" || \
            (echo; echo "Unexpected untracked files after code generation. Run 'go generate ./...' command and commit."; exit 1)

  # Run acceptance tests against each CLI we support
  test:
    name: Acceptance Tests (${{ matrix.cli }} ${{ matrix.version }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: acceptance-tests
      cancel-in-progress: false
    strategy:
      fail-fast: false
      # Running in parallel will cause each test to collide on resource names.
      max-parallel: 1
      matrix:
        include:
          # The oldest Terraform we support. HashiCorp patch only the latest two
          # minors, so this tracks the oldest that is not end-of-life: bump it
          # when we're happy to drop the CLI below.
          - cli: terraform
            version: '1.14.*'
          # The latest Terraform, so we find out about breakage early.
          - cli: terraform
            version: '1.15.*'
          # OpenTofu, tested directly rather than assumed compatible.
          - cli: opentofu
            version: '1.12.5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: matrix.cli == 'terraform'
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: matrix.cli == 'opentofu'
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false
      # terraform-plugin-testing drives the terraform binary on PATH and builds
      # provider addresses under registry.terraform.io, which OpenTofu rejects.
      # Point it at tofu and give it an address OpenTofu will accept.
      - name: Point the test harness at OpenTofu
        if: matrix.cli == 'opentofu'
        run: |
          echo "TF_ACC_TERRAFORM_PATH=$(which tofu)" >> "$GITHUB_ENV"
          echo "TF_ACC_PROVIDER_HOST=registry.opentofu.org" >> "$GITHUB_ENV"
          echo "TF_ACC_PROVIDER_NAMESPACE=incident-io" >> "$GITHUB_ENV"
      - run: go mod download
      - env:
          INCIDENT_API_KEY: ${{ secrets.INCIDENT_API_KEY }}
        run: make testacc
        timeout-minutes: 10
